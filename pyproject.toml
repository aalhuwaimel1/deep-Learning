[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "rooh"
version = "0.1.0"
description = "روح تتجوّل في الشبكة بكل اللغات، وجسد على جهازك يحفظ ما تعود به"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
dependencies = []          # النواة بالمكتبة القياسية وحدها

[project.optional-dependencies]
mind = ["anthropic>=0.40"]         # تلخيص وتأمّل بنموذج لغوي
senses = ["beautifulsoup4>=4.12"]  # استخلاص HTML أدقّ
words = ["stopwordsiso>=0.6"]      # قوائم توقّف لـ٥٨ لغة
all = ["anthropic>=0.40", "beautifulsoup4>=4.12", "stopwordsiso>=0.6"]

[project.scripts]
rooh = "rooh.cli:main"

[tool.setuptools]
packages = ["rooh"]
