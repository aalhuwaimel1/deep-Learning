[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "sade-iov"
version = "0.2.0"
description = "Situation-Aware Dynamic Encryption for the Internet of Vehicles — adaptive, risk-based V2X security prototype."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
  { name = "Abdulrhman Alluwaymi" },
  { name = "Abdulmajeed Alhuwaimel" },
]
keywords = ["IoV", "V2X", "adaptive-security", "context-aware-cryptography",
            "machine-learning", "AES", "PUF", "risk-assessment"]
classifiers = [
  "Programming Language :: Python :: 3",
  "License :: OSI Approved :: MIT License",
  "Topic :: Security :: Cryptography",
  "Intended Audience :: Science/Research",
]
dependencies = [
  "numpy>=1.24",
  "pandas>=2.0",
  "scikit-learn>=1.3",
  "xgboost>=2.0",
  "pycryptodome>=3.19",
  "matplotlib>=3.7",
  "joblib>=1.3",
]

[project.optional-dependencies]
dashboard = ["streamlit>=1.30"]
dev = ["pytest>=7.4", "ruff>=0.4"]

[project.urls]
Homepage = "https://github.com/aalhuwaimel1/deep-Learning"
Demo = "https://aalhuwaimel1.github.io/deep-Learning/"

[tool.setuptools]
packages = ["sade_iov"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
# E501 long lines; E702/E741 allow compact plotting one-liners; B007/B905
# relax loop-var / zip-strict pedantry that does not affect correctness here.
ignore = ["E501", "E702", "E741", "B007", "B905"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
