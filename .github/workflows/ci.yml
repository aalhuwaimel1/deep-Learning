name: CI

on:
  push:
    branches: [ master, "claude/**" ]
  pull_request:
    branches: [ master ]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Lint (ruff)
        run: ruff check sade_iov scripts

      - name: Unit tests
        run: pytest -q

      - name: Smoke — end-to-end pipeline (small)
        run: python -m scripts.run_simulation --epochs 2000

      - name: Reproduce headline experiments (small)
        run: python -m scripts.reproduce_all --epochs 2000 --seeds 3 --quick

      - name: Upload figures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sade-iov-artifacts
          path: artifacts/
          if-no-files-found: ignore
